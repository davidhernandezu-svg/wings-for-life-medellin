name: Despliegue Wings for Life

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      
    steps:
    - name: Copiar código del repositorio
      uses: actions/checkout@v4
      
    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Instalar dependencias
      run: |
        pip install -r requirements.txt
        
    - name: Verificar estado del sistema
      run: |
        echo "¡Código verificado y listo para el club de Mariana Carmona!"
