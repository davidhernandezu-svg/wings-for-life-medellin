<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wings for Life - Hub de Entrenamiento Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#f97316', 600: '#ea580c' },
                        dark: '#020617', card: '#0f172a'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .glow-orange { box-shadow: 0 0 25px rgba(249, 115, 22, 0.3); }
        .lane { position: relative; height: 34px; border-top: 2px dashed rgba(255,255,255,.15); border-bottom: 2px dashed rgba(255,255,255,.15); overflow: hidden; }
        .lane .runner, .lane .car { position: absolute; top: 50%; transform: translateY(-50%); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 3px; white-space: nowrap; }
        .lane .runner { background: #f8fafc; color: #0f172a; left: 62%; transition: left 0.3s ease; }
        .lane .car { background: #f97316; color: #fff; left: 8%; transition: left 0.3s ease; }
        @media (prefers-reduced-motion: no-preference) { .lane.animating .car { animation: chase 7s ease-in-out infinite alternate; } }
        @keyframes chase { from { left: 4%; } to { left: 46%; } }
        .custom-scroll::-webkit-scrollbar { height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Modal de Alertas -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl relative">
            <h3 id="modal-title" class="text-xl font-bold mb-2 text-white">Aviso</h3>
            <p id="modal-message" class="text-slate-300 text-sm mb-6 leading-relaxed"></p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl transition">Entendido</button>
            </div>
        </div>
    </div>

    <!-- Modal Contacto Mariana (Formulario Netlify) -->
    <div id="contact-modal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm hidden overflow-y-auto py-10">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-lg w-full mx-4 shadow-2xl relative my-auto">
            <button onclick="closeContactModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white"><i data-lucide="x"></i></button>
            <h3 class="text-xl font-bold mb-1 text-white">Plan 100% Personalizado</h3>
            <p class="text-slate-400 text-sm mb-5">Déjanos tus datos y Mariana Carmona te contactará para llevar tu entrenamiento al siguiente nivel.</p>

            <form id="leadForm" name="plan-personalizado" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="submitLead(event)" class="space-y-4">
                <input type="hidden" name="form-name" value="plan-personalizado">
                <p hidden><label>No llenar <input name="bot-field" id="botField"></label></p>
                <input type="hidden" id="hdn-vdot" name="vdot">
                <input type="hidden" id="hdn-obj" name="objetivo_km">
                <input type="hidden" id="hdn-ritmo" name="ritmo_crucero">

                <div
